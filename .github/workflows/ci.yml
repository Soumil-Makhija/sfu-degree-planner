name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: python -m pip install -e . build
      - name: Verify official-data fixtures and package resources
        run: |
          python scripts/fetch_sfu.py --offline
          python scripts/sync_package_data.py --check
          git diff --exit-code -- data/catalog.json
      - name: Unit, solver oracle, real-data CLI and HTTP integration
        run: python -m unittest discover -s tests -v
      - name: Syntax and UI logic smoke
        run: |
          python -m compileall -q sfu_planner scripts
          node --check sfu_planner/static/app.js
          python scripts/check_ui.py
      - name: Wheel and installed interface outside checkout
        run: |
          python -m build --wheel
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python scripts/check_installed.py
      - name: Whitespace
        run: git diff --check
